<script>
/* =====================================================================
   설정: Supabase 주소와 공개 키는 같은 폴더의 config.js에 넣습니다.
   그래서 index.html을 새 버전으로 바꿔 올려도 설정을 다시 넣을 필요가 없습니다.
   이 키는 공개되어도 괜찮도록 설계된 키이며, 실제 권한은 DB의 RLS가 막습니다.
   ===================================================================== */
const CFG = window.PRACTICUM_CONFIG || {};
const SUPABASE_URL = CFG.SUPABASE_URL || 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_KEY = CFG.SUPABASE_KEY || 'YOUR-PUBLISHABLE-OR-ANON-KEY';


const TZ = 'Asia/Seoul';
const STUDENT_ID_RE = /^\d{4}-\d{5}$/;
const SNU_EMAIL_RE = /^[a-z0-9._%+-]+@snu\.ac\.kr$/;
const POLL_MS = 5000;

const MSG = {
  OK: '처리되었습니다.',
  NOT_LOGGED_IN: '로그인이 필요합니다.',
  NOT_OPEN: '아직 신청 시작 전입니다.',
  CLOSED: '신청 기간이 끝났습니다.',
  NO_SCHOOL: '지금은 신청할 수 없는 학교입니다.',
  ALREADY_APPLIED: '이미 신청한 학교가 있습니다. 한 사람당 한 학교만 신청할 수 있습니다.',
  NOT_RESERVED: '이 학교는 사전 신청자만 신청할 수 있습니다. 다른 학교를 선택해 주세요.',
  ADMIN_BLOCKED: '관리자 계정은 실제 학교를 신청할 수 없습니다. 테스트교만 신청해 볼 수 있습니다.',
  FORBIDDEN: '관리자만 할 수 있는 작업입니다.',

  SELF: '본인 계정은 삭제할 수 없습니다.',
  PROFILE_ONLY: '회원 정보는 지웠지만 로그인 계정이 남아 있습니다. Supabase 대시보드의 Authentication > Users에서 해당 메일을 삭제해 주세요.',
  RESERVED_ELSEWHERE: '사전 신청한 학교가 있어 다른 학교는 신청할 수 없습니다. 사전 신청한 학교로 신청해 주세요.',
  CAPACITY_TBD: '아직 모집 인원이 정해지지 않은 학교입니다.',
  FULL: '정원이 모두 찼습니다. 다른 학교를 선택해 주세요.',
  CANCEL_DISABLED: '지금은 신청을 취소할 수 없습니다. 담당자에게 문의해 주세요.',
  NO_APPLICATION: '취소할 신청 내역이 없습니다.',
  INVALID_STUDENT_ID: '학번은 0000-00000 형식으로 입력해 주세요.',
  SNU_EMAIL_ONLY: '@snu.ac.kr 메일만 사용할 수 있습니다.',
  NAME_REQUIRED: '이름을 입력해 주세요.',
  DUPLICATE_STUDENT_ID: '이미 가입된 학번입니다. 본인이 가입한 적이 없다면 담당자에게 알려 주세요.',
  DUPLICATE_EMAIL: '이미 가입된 메일입니다. 로그인하거나 비밀번호 찾기를 이용해 주세요.',
  NOT_IN_ROSTER: '가입 명단에 없는 학번 또는 이름입니다. 학번과 이름을 다시 확인해 주세요.'
};
const TITLE = {
  OK: '신청했습니다',
  NOT_RESERVED: '사전 신청자가 아닙니다',
  RESERVED_ELSEWHERE: '사전 신청 학교가 따로 있습니다',
  FULL: '정원이 찼습니다',
  ALREADY_APPLIED: '이미 신청했습니다',
  NOT_OPEN: '신청 시작 전입니다',
  CLOSED: '신청 기간이 끝났습니다',
  CAPACITY_TBD: '인원 미정'
};

/* ---------- 기본 도구 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const fmt = d => new Intl.DateTimeFormat('ko-KR', { timeZone: TZ, month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(d));
const fmtFull = d => new Intl.DateTimeFormat('ko-KR', { timeZone: TZ, year: 'numeric', month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(d));
const fmtMs = d => {
  const dt = new Date(d);
  const base = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(dt);
  return base + '.' + String(dt.getMilliseconds()).padStart(3, '0');
};
const toLocalInput = d => d ? new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(d)).replace(' ', 'T') : '';
const fromLocalInput = v => v ? new Date(v + ':00+09:00').toISOString() : null;
const one = data => Array.isArray(data) ? data[0] : data;

const configured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_KEY.startsWith('YOUR-');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const clockSamples = [];
const state = {
  session: null, profile: null, st: null, offset: 0,
  board: [], mine: null, timers: [], recovery: false,
  adminTab: 'settings', routeToken: 0
};

const serverNow = () => Date.now() + state.offset;
const isOpen = () => state.st && serverNow() >= Date.parse(state.st.open_at);
const isClosed = () => state.st && state.st.close_at && serverNow() >= Date.parse(state.st.close_at);

function render(html) { $('#app').innerHTML = html; }
function clearTimers() { state.timers.forEach(t => clearInterval(t)); state.timers = []; }

/* ---------- 모달 ---------- */
function modal(title, body, { ok = '확인', cancel = null } = {}) {
  return new Promise(resolve => {
    const d = $('#modal');
    $('#modal-title').textContent = title;
    $('#modal-body').textContent = body || '';
    $('#modal-ok').textContent = ok;
    const c = $('#modal-cancel');
    c.hidden = !cancel;
    if (cancel) c.textContent = cancel;
    const done = v => { d.close(); resolve(v); };
    $('#modal-ok').onclick = () => done(true);
    c.onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal();
    $('#modal-ok').focus();
  });
}
const confirmModal = (title, body, ok) => modal(title, body, { ok, cancel: '취소' });

/* ---------- 데이터 ---------- */
async function loadState() {
  const t0 = performance.now();
  const { data, error } = await sb.rpc('get_state');
  const t1 = performance.now();
  if (error) throw error;
  const row = one(data);
  if (!row) throw new Error('settings 테이블이 비어 있습니다. schema.sql을 다시 확인해 주세요.');
  state.st = row;
  // 왕복 시간이 가장 짧았던 측정값을 기준으로 서버 시각과 내 컴퓨터 시각의 차이를 계산
  const rtt = t1 - t0;
  clockSamples.push({ rtt, off: Date.parse(row.server_now) - (Date.now() - rtt / 2) });
  if (clockSamples.length > 12) clockSamples.shift();
  state.offset = clockSamples.reduce((a, b) => (b.rtt < a.rtt ? b : a)).off;
}

async function calibrateClock() {
  for (let i = 0; i < 3; i++) { try { await loadState(); } catch { return; } }
}

function clockHtml() {
  return `<p class="server-clock">서버 시각 <strong id="clock"></strong></p>`;
}

function startClock() {
  const el = $('#clock');
  if (!el) return;
  const f = new Intl.DateTimeFormat('ko-KR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const tick = () => { const c = $('#clock'); if (c) c.textContent = f.format(new Date(serverNow())); };
  tick();
  state.timers.push(setInterval(tick, 100));
}

async function loadProfile() {
  const uid = state.session?.user?.id;
  if (!uid) { state.profile = null; return; }
  const { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  if (error) throw error;
  state.profile = data;
}

/* ---------- 라우팅 ---------- */
let routeTimer = null;
function routeSoon() { clearTimeout(routeTimer); routeTimer = setTimeout(route, 30); }

async function route() {
  clearTimers();
  const token = ++state.routeToken;
  try {
    if (!configured) return renderSetup();
    await loadState();
    if (state.session) await loadProfile(); else state.profile = null;
    if (token !== state.routeToken) return;
    renderNav();

    if (state.recovery) return renderRecovery();
    const hash = location.hash;
    if (!state.session) {
      if (hash === '#signup') return renderSignup();
      if (hash === '#reset') return renderResetRequest();
      return renderLogin();
    }
    if (!state.profile) return renderNoProfile();
    if (hash === '#admin' && state.profile.is_admin) return renderAdmin();
    if (isOpen() || state.profile.is_admin) return renderApply();
    return renderWaiting();
  } catch (e) {
    console.error(e);
    render(`<h1>페이지를 불러오지 못했습니다</h1><p class="lead">${esc(e.message || e)}</p><button class="btn" onclick="route()">다시 시도</button>`);
  }
}

function renderNav() {
  const nav = $('#nav');
  const p = state.profile;
  if (!state.session || !p) { nav.innerHTML = ''; return; }
  const onAdmin = location.hash === '#admin';
  nav.innerHTML = `
    <span class="who">${esc(p.name)}님</span>
    <a href="#" class="${onAdmin ? '' : 'active'}">신청</a>
    ${p.is_admin ? `<a href="#admin" class="${onAdmin ? 'active' : ''}">관리</a>` : ''}
    <button class="link" id="logout" type="button">로그아웃</button>`;
  $('#logout').onclick = async () => {
    await sb.auth.signOut();
    history.replaceState(null, '', location.pathname);
    routeSoon();
  };
}

function renderSetup() {
  render(`<h1>설정이 필요합니다</h1>
    <p class="lead">index.html과 같은 곳에 config.js 파일을 만들고 Supabase 주소와 키를 넣어 주세요. 자세한 순서는 README.md에 있습니다.</p>`);
}

function renderNoProfile() {
  render(`<h1>회원 정보를 찾을 수 없습니다</h1>

/* ---------- 로그인 ---------- */
function renderLogin() {
  const st = state.st;
  render(`
    <h1>2027학년도 독어교육과<br>학교현장실습 실습희망교 신청</h1>

      <label for="email">서울대 메일</label>
      <input id="email" type="email" autocomplete="username" placeholder="아이디@snu.ac.kr" required>

  $('#f').onsubmit = async e => {
    e.preventDefault();
    const email = $('#email').value.trim().toLowerCase();
    const password = $('#pw').value;
    const err = $('#ferr');
    err.textContent = '';
    if (!email || !password) { err.textContent = '메일과 비밀번호를 입력해 주세요.'; return; }

    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = '로그인';
    if (!error) { history.replaceState(null, '', location.pathname); return; }

      err.textContent = '메일 인증이 아직 끝나지 않았습니다. 받은편지함(스팸함 포함)의 인증 링크를 눌러 주세요.';

        modal(r.error ? '보내지 못했습니다' : '인증 메일을 다시 보냈습니다', r.error ? r.error.message : `${email} 받은편지함을 확인해 주세요.`);
      };
    } else if (/invalid login/i.test(error.message)) {
      err.textContent = '메일 또는 비밀번호가 맞지 않습니다.';
    } else {
      err.textContent = error.message;
    }
  };
}

/* ---------- 가입 ---------- */
function renderSignup() {
  render(`
    <h1>가입하기</h1>
    <form id="f" class="card narrow" novalidate style="margin-top:24px">
      <label for="name">이름</label>
      <input id="name" type="text" autocomplete="name" maxlength="30" required>
      <p class="err" id="e-name"></p>

      <label for="sid">학번</label>
      <input id="sid" type="text" inputmode="numeric" placeholder="0000-00000" maxlength="10" pattern="\\d{4}-\\d{5}" required>
      <p class="err" id="e-sid"></p>

      <label for="email">서울대 메일</label>
      <input id="email" type="email" autocomplete="email" placeholder="아이디@snu.ac.kr" required>
      <p class="err" id="e-email"></p>

      <label for="pw">비밀번호</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
      <p class="hint">8자 이상</p>
      <p class="err" id="e-pw"></p>

      <label for="pw2">비밀번호 확인</label>
      <input id="pw2" type="password" autocomplete="new-password" required>
      <p class="err" id="e-pw2"></p>

      <p class="err" id="ferr"></p>
      <button class="btn full" id="submit">가입하기</button>
      <p class="sub">이미 가입했나요? <a href="#">로그인</a></p>
    </form>`);

  const sid = $('#sid');
  sid.addEventListener('input', () => {
    const d = sid.value.replace(/\D/g, '').slice(0, 9);
    sid.value = d.length > 4 ? d.slice(0, 4) + '-' + d.slice(4) : d;
  });

  const checks = {
    name: () => $('#name').value.trim() ? '' : MSG.NAME_REQUIRED,
    sid: () => STUDENT_ID_RE.test(sid.value.trim()) ? '' : MSG.INVALID_STUDENT_ID,
    email: () => SNU_EMAIL_RE.test($('#email').value.trim().toLowerCase()) ? '' : MSG.SNU_EMAIL_ONLY,
    pw: () => $('#pw').value.length >= 8 ? '' : '비밀번호는 8자 이상이어야 합니다.',
    pw2: () => $('#pw2').value === $('#pw').value ? '' : '비밀번호가 서로 다릅니다.'
  };
  const show = (k) => {
    const m = checks[k]();
    $('#e-' + k).textContent = m;
    const input = $('#' + k);
    if (input && input.type !== 'checkbox') input.setAttribute('aria-invalid', m ? 'true' : 'false');
    return !m;
  };
  Object.keys(checks).forEach(k => $('#' + k).addEventListener('blur', () => show(k)));

  $('#f').onsubmit = async e => {
    e.preventDefault();
    $('#ferr').textContent = '';
    const allOk = Object.keys(checks).map(show).every(Boolean);
    if (!allOk) return;

    const name = $('#name').value.trim();
    const student_id = sid.value.trim();
    const email = $('#email').value.trim().toLowerCase();
    const password = $('#pw').value;
    const btn = $('#submit'); btn.disabled = true; btn.textContent = '확인 중';

    const pre = await sb.rpc('signup_precheck', { p_student_id: student_id, p_name: name, p_email: email });
    if (pre.error || pre.data !== 'OK') {
      btn.disabled = false; btn.textContent = '가입하기';
      $('#ferr').textContent = pre.error ? pre.error.message : (MSG[pre.data] || pre.data);
      return;
    }

    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { student_id, name }, emailRedirectTo: location.origin + location.pathname }
    });
    btn.disabled = false; btn.textContent = '가입하기';
    if (error) {
      if (/already registered/i.test(error.message)) $('#ferr').textContent = MSG.DUPLICATE_EMAIL;
      else if (/database error/i.test(error.message)) $('#ferr').textContent = '가입 정보를 저장하지 못했습니다. 학번 중복이나 명단 불일치일 수 있으니 확인 후 다시 시도해 주세요.';
      else $('#ferr').textContent = error.message;
      return;
    }
    if (data.session) { history.replaceState(null, '', location.pathname); routeSoon(); return; }
    render(`<h1>인증 메일을 보냈습니다</h1>
      <p class="lead">${esc(email)} 받은편지함에서 인증 링크를 누르면 가입이 끝납니다. 메일이 보이지 않으면 스팸함도 확인해 주세요.</p>
      <a class="btn secondary" href="#">로그인 화면으로</a>`);
  };
}

/* ---------- 사전 페이지 (시작 전, 일반 회원) ---------- */
function renderWaiting() {
  const st = state.st, p = state.profile;
  render(`
    <h1>실습희망교 신청은 아직 시작 전입니다</h1>
    <p class="lead">${esc(fmtFull(st.open_at))}이 되면 이 화면이 신청 화면으로 바뀝니다. 새로고침하지 않아도 됩니다.</p>
    <div class="countdown" id="cd" role="timer" aria-live="off"></div>
    ${clockHtml()}
    <div id="notice-wrap">${noticeHtml()}</div>
    <div id="preview-wrap"></div>
    <section>
      <h2>내 가입 정보</h2>
      <dl class="card kv">
        <dt>이름</dt><dd>${esc(p.name)}</dd>
        <dt>학번</dt><dd>${esc(p.student_id)}</dd>
        <dt>메일</dt><dd>${esc(p.email)}</dd>
      </dl>
      <p class="hint">정보가 틀렸다면 신청 시작 전에 담당자에게 알려 주세요.</p>
    </section>`);

  const cd = $('#cd');
  const target = Date.parse(st.open_at);
  const tick = () => {
    const ms = target - serverNow();
    if (ms <= 0) { clearTimers(); cd.textContent = '곧 열립니다'; setTimeout(route, 300 + Math.random() * 700); return; }
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    const pad = n => String(n).padStart(2, '0');
    cd.innerHTML = (d ? `${d}<small>일</small> ` : '') + `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
  };
  tick();
  state.timers.push(setInterval(tick, 250));
  startClock();
  calibrateClock();
  refreshPreview();
  // 공지, 일정, 미리 공개 설정 변경을 반영하기 위해 30초마다 서버 상태를 다시 읽음
  state.timers.push(setInterval(async () => {
    const prev = state.st.open_at;
    try { await loadState(); } catch { return; }
    if (state.st.open_at !== prev) return route();
    $('#notice-wrap').innerHTML = noticeHtml();
    refreshPreview();
  }, 30000));
}

async function refreshPreview() {
  const wrap = $('#preview-wrap');
  if (!wrap) return;
  if (!state.st.show_preview) { wrap.innerHTML = ''; return; }
  const { data, error } = await sb.rpc('get_board');
  if (error || !$('#preview-wrap')) return;
  const rows = data || [];
  wrap.innerHTML = `<section>
    <h2>신청 가능 학교 미리 보기</h2>
    <ul class="schools">${rows.length ? rows.map(x => `
      <li class="school preview">
        <div class="school-name">${esc(x.name)}${x.is_reserved ? '<span class="tag">사전 신청자 전용</span>' : ''}${x.is_test ? '<span class="tag plain">테스트</span>' : ''}</div>
        <div class="count">${x.capacity == null ? '인원 미정' : `정원 <strong>${x.capacity}</strong>명`}</div>
      </li>`).join('') : '<li class="school empty">표시할 학교가 없습니다.</li>'}</ul>
    <p class="hint">신청 버튼은 시작 시각이 되면 나타납니다. 정원은 바뀔 수 있습니다.</p>
  </section>`;
}

/* ---------- 신청 페이지 ---------- */
function renderApply() {
  const p = state.profile, st = state.st;
  const preview = p.is_admin && !isOpen();
  render(`
    <h1>실습희망교 신청</h1>
    <p class="lead">인원은 몇 초마다 자동으로 갱신됩니다.</p>
    ${clockHtml()}
    ${p.is_admin ? `<div class="banner">${preview ? `관리자 미리보기입니다. 일반 회원은 ${esc(fmtFull(st.open_at))} 전까지 사전 페이지를 봅니다. ` : ''}관리자 계정은 실제 학교를 신청할 수 없고, 테스트교만 신청해 볼 수 있습니다.</div>` : ''}
    ${isClosed() ? `<div class="banner">신청 기간이 끝났습니다.</div>` : ''}
    <div id="notice-wrap">${noticeHtml()}</div>
    <section>
      <h2>내 신청</h2>
      <div class="card" id="mine">불러오는 중</div>
    </section>
    <section>
      <h2>학교 목록</h2>
      <ul class="schools" id="schools"><li class="school empty">불러오는 중</li></ul>
      <p class="hint" id="updated"></p>
    </section>`);

  $('#schools').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if (b && !b.disabled) onApply(Number(b.dataset.id), b);
  });

  refreshApply();
  state.timers.push(setInterval(refreshApply, POLL_MS));
  startClock();
  calibrateClock();

let refreshing = false;
async function refreshApply() {
  if (refreshing) return;
  refreshing = true;
  try {
    const wasOpen = isOpen();
    const [b, m] = await Promise.all([sb.rpc('get_board'), sb.rpc('get_my_application'), loadState()]);
    if (b.error) throw b.error;
    if (m.error) throw m.error;
    state.board = b.data || [];
    state.mine = one(m.data) || null;
    if (!$('#schools')) return;
    if (state.profile.is_admin && !wasOpen && isOpen()) { route(); return; }
    $('#notice-wrap').innerHTML = noticeHtml();
    renderMine();
    renderSchools();
    $('#updated').textContent = `마지막 갱신 ${new Intl.DateTimeFormat('ko-KR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date(serverNow()))}`;
  } catch (e) {
    console.error(e);
    const u = $('#updated'); if (u) u.textContent = '갱신하지 못했습니다. 잠시 후 다시 시도합니다.';
  } finally {
    refreshing = false;
  }
}

function renderMine() {
  const el = $('#mine'), p = state.profile, m = state.mine;
  if (!m) {
    el.innerHTML = `${esc(p.name)}(${esc(p.student_id)})님은 아직 신청하지 않았습니다.`;
    return;
  }
  const canCancel = state.st.allow_cancel && !isClosed();
  el.innerHTML = `<strong>${esc(m.school_name)}</strong>에 신청했습니다.
    <p class="hint">신청 시각 ${esc(fmtMs(m.applied_at))}</p>
    ${canCancel ? `<div class="row"><button class="btn danger sm" id="cancel-app" type="button">신청 취소</button></div>` : ''}`;
  if (canCancel) $('#cancel-app').onclick = onCancel;
}

function renderSchools() {
  const ul = $('#schools');
  if (!state.board.length) { ul.innerHTML = '<li class="school empty">표시할 학교가 없습니다.</li>'; return; }
  ul.innerHTML = state.board.map(schoolRow).join('');
}

function schoolRow(s) {
  const admin = state.profile.is_admin, mine = state.mine;
  const cap = s.capacity, full = cap != null && s.applied >= cap;
  const timeBypass = admin && s.is_test;
  const isMine = mine && mine.school_id === s.id;
  let label = '신청', disabled = false;
  if (isMine) { label = '신청함'; disabled = true; }
  else if (admin && !s.is_test) { label = '관리자 불가'; disabled = true; }
  else if (cap == null) { label = '인원 미정'; disabled = true; }
  else if (full) { label = '마감'; disabled = true; }
  else if (mine) { disabled = true; }
  else if (!timeBypass && isClosed()) { label = '기간 종료'; disabled = true; }
  else if (!timeBypass && !isOpen()) { label = '시작 전'; disabled = true; }
  const pct = cap ? Math.min(100, s.applied / cap * 100) : 0;
  return `<li class="school${isMine ? ' mine' : ''}">
    <div>
      <div class="school-name">${esc(s.name)}${s.is_reserved ? '<span class="tag">사전 신청자 전용</span>' : ''}${s.is_test ? '<span class="tag plain">테스트</span>' : ''}</div>
      ${cap != null ? `<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>` : ''}
    </div>
    <div class="count">${cap == null ? '미정' : `<strong>${s.applied}</strong> / ${cap}명`}</div>
    <button class="btn sm" type="button" data-id="${s.id}" ${disabled ? 'disabled' : ''} aria-label="${esc(s.name)} ${label}">${label}</button>
  </li>`;
}

async function onApply(id, btn) {
  const s = state.board.find(x => x.id === id);
  if (!s) return;
  const note = state.st.allow_cancel ? '신청을 취소하면 그 자리는 다른 사람이 신청할 수 있게 됩니다.' : '신청한 뒤에는 직접 바꿀 수 없습니다.';
  const ok = await confirmModal(`${s.name}에 신청할까요?`, note, '신청하기');
  if (!ok) return;
  btn.disabled = true; btn.textContent = '처리 중';
  const { data, error } = await sb.rpc('apply_school', { p_school_id: id });
  if (error) await modal('신청하지 못했습니다', error.message);
  else if (data === 'OK') await modal(TITLE.OK, `${s.name}에 신청이 완료되었습니다.`);
  else await modal(TITLE[data] || '신청하지 못했습니다', MSG[data] || data);
  refreshApply();
}

async function onCancel() {
  const ok = await confirmModal('신청을 취소할까요?', '취소하면 그 자리는 바로 다른 사람이 신청할 수 있습니다.', '취소하기');
  if (!ok) return;
  const { data, error } = await sb.rpc('cancel_my_application');
  if (error) await modal('취소하지 못했습니다', error.message);
  else if (data === 'OK') await modal('신청을 취소했습니다', '다른 학교를 신청할 수 있습니다.');
  else await modal('취소하지 못했습니다', MSG[data] || data);
  refreshApply();
}

    loadPanel();
  };
  loadPanel();
}

async function loadPanel() {
  clearTimers();
  const panel = $('#panel');
  panel.innerHTML = '<p class="hint">불러오는 중</p>';
  try {
    if (state.adminTab === 'settings') return await panelSettings(panel);
    if (state.adminTab === 'schools') return await panelSchools(panel);
    if (state.adminTab === 'apps') return await panelApps(panel);
    if (state.adminTab === 'members') return await panelMembers(panel);
    if (state.adminTab === 'roster') return await panelRoster(panel);
    if (state.adminTab === 'log') return await panelLog(panel);
  } catch (e) {
    console.error(e);
    panel.innerHTML = `<p class="err">${esc(e.message || e)}</p>`;
  }
}

async function panelSchools(panel) {

  });

    if (!r.error && (r.data === 'FULL' || r.data === 'CAPACITY_TBD')) {
      const why = r.data === 'FULL' ? '정원이 이미 찼습니다' : '정원이 아직 정해지지 않았습니다';
      if (!await confirmModal(`${schoolName}은(는) ${why}`, '그래도 배정할까요? 정원을 넘겨서 배정됩니다.', '그래도 배정')) return;
      r = await sb.rpc('admin_assign', { p_student_id: sid, p_school_id: schoolId, p_force: true });
    }
    if (r.error) return modal('배정하지 못했습니다', r.error.message);
    if (r.data === 'ASSIGNED') await modal('배정했습니다', `${sid} 학생을 ${schoolName}에 배정했습니다.`);
    else if (r.data === 'MOVED') await modal('학교를 옮겼습니다', `${sid} 학생을 ${schoolName}(으)로 옮겼습니다.`);
    else return modal('배정하지 못했습니다', MSG[r.data] || r.data);

  const area = $('#apps-area');

    if (error) throw error;
    if (!document.body.contains(area)) return;
    const rows = data || [];
    area.innerHTML = `
      <div class="row" style="margin-top:0;margin-bottom:14px;justify-content:space-between">

          <button class="btn sm danger" id="reset" type="button">신청 기록 모두 삭제</button>
        </span>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>학교</th><th>순번</th><th>학번</th><th>이름</th><th>메일</th><th>신청 시각</th><th></th></tr></thead>
        <tbody>${rows.length ? rows.map(x => `
          <tr><td>${esc(x.school_name)}</td><td class="num">${x.rank_in_school}</td><td class="num">${esc(x.student_id)}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td>
          <td class="num">${esc(fmtMs(x.applied_at))}</td>
          <td><button class="btn sm secondary" type="button" data-move="${esc(x.student_id)}">옮기기</button> <button class="btn sm danger" type="button" data-del="${x.app_id}" data-who="${esc(x.name)}">삭제</button></td></tr>`).join('')
          : '<tr><td colspan="7" class="hint">아직 신청이 없습니다.</td></tr>'}</tbody>
      </table></div>
      <p class="hint">10초마다 자동으로 갱신됩니다. 신청 시각은 서버 기준이며 밀리초까지 표시합니다. 옮기기를 누르면 위 배정 칸에 학번이 채워집니다.</p>`;

    $('#csv').onclick = () => downloadCsv(rows);
    $('#reset').onclick = async () => {
      if (!await confirmModal('신청 기록을 모두 삭제할까요?', '테스트를 마친 뒤 실제 신청 전에 쓰는 기능입니다. 되돌릴 수 없고, 삭제 내역은 기록 탭에 남습니다.', '모두 삭제')) return;
      const { error } = await sb.from('applications').delete().gt('id', 0);

    };
    area.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {

      draw();
    });
  };
  await draw();
  state.timers.push(setInterval(() => {

    if (!document.querySelector('dialog[open]') && !typing) draw().catch(console.error);
  }, 10000));
}

function downloadCsv(rows) {
  const head = ['학교', '순번', '학번', '이름', '메일', '신청 시각'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [head.map(q).join(',')].concat(rows.map(x => [x.school_name, x.rank_in_school, x.student_id, x.name, x.email, fmtMs(x.applied_at)].map(q).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `실습희망교_신청현황_${toLocalInput(new Date()).replace(/[-:T]/g, '').slice(0, 12)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

      tr.querySelector('[data-cell="name"]').innerHTML = `<input class="inline-input" type="text" value="${esc(row.name)}" maxlength="30" data-in="name">`;
      tr.querySelector('[data-cell="act"]').innerHTML = `<button class="btn sm" type="button" data-save>저장</button> <button class="btn sm secondary" type="button" data-cancel>취소</button>`;
      tr.querySelector('[data-in="sid"]').focus();
      return;
    }
    if (e.target.closest('[data-cancel]')) { loadPanel(); return; }
    if (e.target.closest('[data-save]')) {
      const sid = tr.querySelector('[data-in="sid"]').value.trim();
      const name = tr.querySelector('[data-in="name"]').value.trim();
      const { data: code, error } = await sb.rpc('admin_update_member', { p_user_id: uid, p_student_id: sid, p_name: name });
      if (error) return modal('저장하지 못했습니다', error.message);
      if (code !== 'OK') return modal('저장하지 못했습니다', MSG[code] || code);
      await modal('저장했습니다', `${name} (${sid})`);
      loadPanel();
      return;
    }
    if (e.target.closest('[data-remove]')) {
      const detail = `${row.name} (${row.student_id}), ${row.email}${row.school_name ? `\n신청 학교: ${row.school_name}` : ''}\n\n계정과 신청 기록이 함께 지워지고 되돌릴 수 없습니다. 삭제 내역은 기록 탭에 남습니다.`;
      if (!await confirmModal('이 회원을 삭제할까요?', detail, '삭제')) return;
      const { data: code, error } = await sb.rpc('admin_delete_member', { p_user_id: uid });
      if (error) return modal('삭제하지 못했습니다', error.message);
      if (code === 'OK') await modal('삭제했습니다', `${row.name} (${row.student_id})`);
      else await modal(code === 'PROFILE_ONLY' ? '일부만 삭제했습니다' : '삭제하지 못했습니다', MSG[code] || code);
      loadPanel();
    }
  });
}

async function panelRoster(panel) {
  const { data, error } = await sb.from('roster').select('*').order('student_id');
  if (error) throw error;
  panel.innerHTML = `
    <form id="fr" class="card">
      <label for="roster">가입 허용 명단 (${data.length}명)</label>
      <textarea id="roster" rows="12" placeholder="2024-12345,홍길동&#10;2024-12346	김철수">${esc(data.map(x => `${x.student_id},${x.name}`).join('\n'))}</textarea>
      <p class="hint">한 줄에 한 명씩 학번과 이름을 쉼표나 탭으로 구분해 넣습니다. 엑셀에서 두 열을 복사해 붙여 넣어도 됩니다. 명단이 한 명이라도 있으면 명단에 있는 학번과 이름이 모두 맞아야 가입할 수 있고, 비워 두면 누구나 형식만 맞으면 가입할 수 있습니다. 이미 가입한 회원에게는 영향이 없습니다.</p>
      <p class="err" id="e-roster"></p>
      <div class="row"><button class="btn">명단 저장</button></div>
    </form>`;
  $('#fr').onsubmit = async e => {
    e.preventDefault();
    const lines = $('#roster').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const rows = [], bad = [];
    const seen = new Set();
    lines.forEach((l, i) => {
      const [sid, ...rest] = l.split(/[,\t]/).map(x => x.trim());
      const name = rest.join(' ').trim();
      if (!STUDENT_ID_RE.test(sid) || !name) bad.push(i + 1);
      else if (!seen.has(sid)) { seen.add(sid); rows.push({ student_id: sid, name }); }
    });
    if (bad.length) { $('#e-roster').textContent = `${bad.join(', ')}번째 줄의 형식을 확인해 주세요.`; return; }
    if (!await confirmModal('명단을 저장할까요?', `기존 명단을 지우고 ${rows.length}명으로 바꿉니다.`, '저장')) return;
    const del = await sb.from('roster').delete().neq('student_id', '');
    if (del.error) return modal('저장하지 못했습니다', del.error.message);
    if (rows.length) {
      const ins = await sb.from('roster').insert(rows);
      if (ins.error) return modal('저장하지 못했습니다', ins.error.message);
    }
    modal('명단을 저장했습니다', `${rows.length}명`);
    loadPanel();
  };
}

async function panelLog(panel) {
  const { data, error } = await sb.from('audit_log').select('*').order('id', { ascending: false }).limit(1000);
  if (error) throw error;
  const rows = data || [];
  panel.innerHTML = `
    <div class="row" style="margin-top:0;margin-bottom:14px">
      <input id="log-q" type="text" placeholder="이름, 학번, 학교, 내용으로 찾기" style="flex:1;min-width:200px">
      <button class="btn sm secondary" id="log-refresh" type="button">새로고침</button>
      <button class="btn sm secondary" id="log-csv" type="button">CSV 내려받기</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>시각</th><th>한 사람</th><th>내용</th><th>상세</th></tr></thead>
      <tbody id="log-body"></tbody>
    </table></div>
    <p class="hint">가입, 신청, 취소, 삭제, 배정, 이동, 회원 수정, 일정과 공지 변경, 학교 설정 변경이 자동으로 기록됩니다. 기록은 화면에서 지우거나 고칠 수 없습니다. 최근 1000건까지 보입니다.</p>`;
  const body = $('#log-body');
  const drawRows = () => {
    const q = $('#log-q').value.trim().toLowerCase();
    const list = q ? rows.filter(x => `${x.actor} ${x.action} ${x.detail}`.toLowerCase().includes(q)) : rows;
    body.innerHTML = list.length ? list.map(x => `
      <tr><td class="num">${esc(fmtMs(x.at))}</td><td>${esc(x.actor)}</td><td>${esc(x.action)}</td><td style="white-space:normal;min-width:260px">${esc(x.detail)}</td></tr>`).join('')
      : '<tr><td colspan="4" class="hint">기록이 없습니다.</td></tr>';
  };
  drawRows();
  $('#log-q').addEventListener('input', drawRows);
  $('#log-refresh').onclick = () => loadPanel();
  $('#log-csv').onclick = () => {
    const qv = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lines = [['시각', '한 사람', '내용', '상세'].map(qv).join(',')].concat(rows.map(x => [fmtMs(x.at), x.actor, x.action, x.detail].map(qv).join(',')));
    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const el = document.createElement('a');
    el.href = URL.createObjectURL(blob);
    el.download = `실습희망교_기록_${toLocalInput(new Date()).replace(/[-:T]/g, '').slice(0, 12)}.csv`;
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(() => URL.revokeObjectURL(el.href), 1000);
  };
}

}
